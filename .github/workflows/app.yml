# The PoC's CI/CD (B-030, D-060): tests on every push and pull request. A push to main that changes the app
# deploys it to the test slot (https://compicasa-test.azurewebsites.net: made-up people and homes, its own
# database). Production deploys only by hand: Actions > App > Run workflow on main, target "production".
# Azure sign-in is OpenID Connect through the
# app registration "compicasa-github-deploy": no stored secret, allowed only from main of this repository,
# and its only role is Website Contributor on the web app. The infrastructure (Bicep, database access)
# still deploys from a machine with `deploy.ps1 -Infra`.
name: App

on:
  push:
    paths: ['app/**', '.github/workflows/app.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/app.yml']
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to deploy main: the test slot, or production (the live site)'
        type: choice
        options: [test, production]
        default: test

permissions:
  contents: read

env:
  RESOURCE_GROUP: rg-compicasa-prod
  WEB_APP: compicasa
  # Pushes go to the test slot; only a manual run with target production deploys the live site (D-060).
  TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'test' }}
  DOTNET_NOLOGO: true

jobs:
  test:
    # Windows, like the web app and the developers' machines
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test app/Compicasa.slnx -c Release -v q
      - name: Publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          dotnet publish app/src/Compicasa.Api/Compicasa.Api.csproj -c Release -o publish -v q
          Compress-Archive -Path publish/* -DestinationPath app.zip
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: app
          path: app.zip
          retention-days: 7

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    # One deploy at a time per target; a newer push waits for the one running
    concurrency:
      group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.target || 'test' }}
      cancel-in-progress: false
    # No GitHub environment here: one would change the sign-in subject that compicasa-github-deploy trusts (main only).
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Signs in through External ID only (D-034)
        shell: pwsh
        run: |
          $slot = if ($env:TARGET -eq 'production') { @() } else { @('--slot', $env:TARGET) }
          $mode = ((az webapp config appsettings list -g $env:RESOURCE_GROUP -n $env:WEB_APP @slot -o json) | ConvertFrom-Json | Where-Object name -eq 'Auth__Mode').value
          if ($mode -ne 'External') { throw "$env:TARGET is not set up for External ID sign-in (D-034): not deploying." }
      - name: Deploy to ${{ env.TARGET }}
        shell: pwsh
        run: |
          $slot = if ($env:TARGET -eq 'production') { @() } else { @('--slot', $env:TARGET) }
          az webapp deploy -g $env:RESOURCE_GROUP -n $env:WEB_APP @slot --src-path app.zip --type zip --restart true --track-status false -o none
          if ($LASTEXITCODE -ne 0) { throw 'deploy failed' }
      - name: Wait until ready
        shell: pwsh
        run: |
          $slot = if ($env:TARGET -eq 'production') { @() } else { @('--slot', $env:TARGET) }
          $url = "https://$(az webapp show -g $env:RESOURCE_GROUP -n $env:WEB_APP @slot --query defaultHostName -o tsv)/healthz/ready"
          # The free database may be paused, so the first start can take a minute or two
          for ($i = 0; $i -lt 30; $i++) {
            try { $r = Invoke-WebRequest $url -TimeoutSec 30 -SkipHttpErrorCheck; if ($r.StatusCode -eq 200) { "Ready: $url"; exit 0 } } catch {}
            Start-Sleep -Seconds 10
          }
          throw "Not ready after five minutes: $url"
