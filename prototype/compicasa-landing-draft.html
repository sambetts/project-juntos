<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>Compicasa – encuentra con quién comprar tu vivienda (borrador)</title>
<style>
:root{
  --bg:#f5f6fa;--surface:#ffffff;--surface-2:#eef1f7;--text:#1b2230;--muted:#5b6476;--border:#dfe4ee;
  --brand:#b3370e;--brand-soft:#fff0e8;--brand-ink:#ffffff;--teal:#0f766e;--teal-soft:#e3f4f1;
  --good:#18794e;--good-bg:#e7f6ee;--warn:#9a5b00;--warn-bg:#fff4e0;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 6px 20px rgba(16,24,40,.07);--radius:16px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0e131b;--surface:#161d28;--surface-2:#1e2735;--text:#e8edf4;--muted:#9ba7b9;--border:#2a3546;
    --brand:#ff7a45;--brand-soft:#3a2216;--brand-ink:#1b1209;--teal:#4fd1c5;--teal-soft:#123230;
    --good:#5bd39b;--good-bg:#12302a;--warn:#f3b45f;--warn-bg:#382a14;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);}
}
*{box-sizing:border-box}
html,body{margin:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.5;font-size:16px}
button,input,select{font:inherit;color:inherit}
a{color:var(--teal)}
.wrap{max-width:1080px;margin-inline:auto;padding-inline:16px}
.skip{position:absolute;inset-inline-start:16px;inset-block-start:-60px;background:var(--text);color:var(--bg);padding:8px 12px;border-radius:10px;z-index:30}
.skip:focus{inset-block-start:12px}
.draftbar{background:var(--warn-bg);color:var(--warn);font-size:13.5px;font-weight:600}
.draftbar .wrap{padding-block:8px}
header.top{background:var(--surface);border-block-end:1px solid var(--border)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.logo{inline-size:40px;block-size:40px;border-radius:12px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;font-size:20px;flex:none}
.brandname{font-weight:800;font-size:19px;margin:0}
.brandline{margin:0;color:var(--muted);font-size:13px}
.spacer{flex:1}
.btn{appearance:none;display:inline-block;text-decoration:none;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:11px 18px;border-radius:12px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.small{padding:7px 12px;font-size:14px}
section{padding-block:40px}
section+section{border-block-start:1px solid var(--border)}
h1{font-size:clamp(28px,5vw,42px);line-height:1.15;margin:0 0 14px;letter-spacing:-.01em}
h2{font-size:clamp(22px,3.4vw,28px);margin:0 0 8px}
h3{font-size:17px;margin:0 0 6px}
.lead{color:var(--muted);font-size:18px;margin:0 0 22px;max-inline-size:60ch}
.hint{color:var(--muted);font-size:13.5px}
.hero{display:grid;gap:28px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));align-items:center}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.brief h3{display:flex;align-items:center;gap:8px}
.tagpill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
ul.clean{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:10px}
ul.clean li{display:flex;gap:10px;align-items:flex-start}
.tag{font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;white-space:nowrap;flex:none;margin-block-start:2px}
.tag.must{background:var(--brand-soft);color:var(--brand)}
.tag.nice{background:var(--teal-soft);color:var(--teal)}
.tag.tip{background:var(--surface-2);color:var(--muted)}
.members{display:flex;gap:8px;margin-block-start:14px;flex-wrap:wrap}
.member{font-size:13px;background:var(--surface-2);border-radius:999px;padding:5px 12px}
.grid{display:grid;gap:16px}
.cols{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
ol.steps{list-style:none;padding:0;margin:20px 0 0;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding-block-start:44px}
ol.steps li::before{content:counter(s);position:absolute;inset-block-start:16px;inset-inline-start:20px;inline-size:30px;block-size:30px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:800}
ol.steps li.card{padding-block-start:58px}
.card p{margin:0}
.nots{display:grid;gap:10px;margin:18px 0 0;padding:0;list-style:none}
.nots li{display:flex;gap:10px;align-items:flex-start}
.nots li::before{content:"";flex:none;inline-size:10px;block-size:10px;border-radius:50%;background:var(--brand);margin-block-start:8px}
details.faq{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
details.faq+details.faq{margin-block-start:10px}
details.faq summary{cursor:pointer;font-weight:600}
details.faq p{margin:10px 0 0;color:var(--muted)}
.formcard{max-inline-size:560px}
.field{margin-block-end:16px}
.field label,.field .label{display:block;font-weight:600;margin-block-end:6px}
.opt-note{color:var(--muted);font-weight:400}
input[type=email],select{inline-size:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface)}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{accent-color:var(--brand);inline-size:18px;block-size:18px;margin:3px 0 0;flex:none}
.err{color:var(--warn);font-size:14px;font-weight:600;margin:6px 0 0}
[aria-invalid="true"]{border-color:var(--warn)}
.done{background:var(--good-bg);color:var(--good);border-radius:12px;padding:12px 14px;font-weight:600;margin-block-end:16px}
footer.foot{color:var(--muted);font-size:13.5px;padding-block:24px 40px;border-block-start:1px solid var(--border)}
footer.foot p{margin:0 0 6px}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.sr{position:absolute;inline-size:1px;block-size:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
</style>
</head>
<body>
<a class="skip" id="skip" href="#join">Ir al formulario</a>
<div id="app"><noscript><p class="wrap">Este borrador necesita JavaScript. · This draft needs JavaScript.</p></noscript></div>
<script>

var BRAND='Compicasa';
var STR={

  s3t:'Acordad qué casa necesitáis',s3d:'Preparáis juntos una lista común: dormitorios, zona, lo imprescindible y lo deseable. Y habláis desde el principio de qué pasará si alguien quiere salir.',

  submit:'Apuntarme',

},
en:{
  title:'{brand} – find who to buy your home with (draft)',

var lang='es';
function setLang(l){lang=(l==='en')?'en':'es';}
function t(k){var s=STR[lang][k];if(s===undefined)return k;return s.replace(/\{brand\}/g,BRAND);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function validEmail(s){return /^[^\s@]+@[^\s@.]+(\.[^\s@.]+)+$/.test(String(s).trim());}
/* Returns which fields fail; the values themselves are never kept. */
function checkForm(email,consent){var e=[];if(!validEmail(email))e.push('email');if(!consent)e.push('consent');return e;}
/* ===== LOGIC END ===== */

var state={sent:false,errors:[]};
function opts(keys){return '<option value="">'+esc(t('choose'))+'</option>'+keys.map(function(k){return '<option value="'+k+'">'+esc(t(k))+'</option>';}).join('');}
function view(){
  var other=lang==='es'?'en':'es';
  var errE=state.errors.indexOf('email')>=0,errC=state.errors.indexOf('consent')>=0;
  return ''
  +'<div class="draftbar" role="note"><div class="wrap">'+esc(t('draft'))+'</div></div>'
  +'<header class="top"><div class="wrap">'
  +  '<div class="logo" aria-hidden="true">'+esc(BRAND.charAt(0))+'</div>'
  +  '<div><p class="brandname">'+esc(BRAND)+'</p><p class="brandline">'+esc(t('tagline'))+'</p></div>'
  +  '<span class="spacer"></span>'
  +  '<button type="button" class="btn small" id="lang-switch" data-id="'+other+'" lang="'+other+'" aria-label="'+esc(t('switchAria'))+'">'+esc(t('switchLabel'))+'</button>'
  +'</div></header>'
  +'<main>'
  +'<section><div class="wrap hero">'
  +  '<div><h1>'+esc(t('heroTitle'))+'</h1><p class="lead">'+esc(t('heroLead'))+'</p>'
  +    '<div class="actions"><a class="btn primary" href="#join">'+esc(t('ctaJoin'))+'</a><a class="btn" href="#how">'+esc(t('ctaHow'))+'</a></div>'
  +    '<p class="hint">'+esc(t('heroNote'))+'</p></div>'
  +  '<div class="card brief" aria-label="'+esc(t('exTag'))+'"><h3>'+esc(t('exTitle'))+' <span class="tagpill">'+esc(t('exTag'))+'</span></h3>'
  +    '<ul class="clean">'
  +      '<li><span class="tag tip">'+esc(t('sizeTag'))+'</span><span>'+esc(t('exRooms'))+'</span></li>'
  +      '<li><span class="tag tip">'+esc(t('areaTag'))+'</span><span>'+esc(t('exArea'))+'</span></li>'
  +      '<li><span class="tag must">'+esc(t('mustTag'))+'</span><span>'+esc(t('exMust'))+'</span></li>'
  +      '<li><span class="tag nice">'+esc(t('niceTag'))+'</span><span>'+esc(t('exNice'))+'</span></li>'
  +      '<li><span class="tag tip">'+esc(t('exitTag'))+'</span><span>'+esc(t('exExit'))+'</span></li>'
  +    '</ul>'
  +    '<p class="hint" style="margin-block-start:14px">'+esc(t('exMembers'))+'</p>'
  +    '<div class="members"><span class="member">'+esc(t('exM1'))+'</span><span class="member">'+esc(t('exM2'))+'</span><span class="member">'+esc(t('exM3'))+'</span></div>'
  +  '</div>'
  +'</div></section>'
  +'<section id="how" tabindex="-1"><div class="wrap"><h2>'+esc(t('howTitle'))+'</h2><p class="lead">'+esc(t('howLead'))+'</p>'
  +  '<ol class="steps grid cols">'+[1,2,3,4].map(function(i){return '<li class="card"><h3>'+esc(t('s'+i+'t'))+'</h3><p>'+esc(t('s'+i+'d'))+'</p></li>';}).join('')+'</ol>'
  +'</div></section>'
  +'<section><div class="wrap"><h2>'+esc(t('notTitle'))+'</h2>'
  +  '<ul class="nots">'+[1,2,3,4].map(function(i){return '<li>'+esc(t('not'+i))+'</li>';}).join('')+'</ul>'
  +'</div></section>'
  +'<section><div class="wrap"><h2>'+esc(t('faqTitle'))+'</h2><div style="margin-block-start:16px">'
  +  [1,2,3,4,5,6].map(function(i){return '<details class="faq"><summary>'+esc(t('q'+i))+'</summary><p>'+esc(t('a'+i))+'</p></details>';}).join('')
  +'</div></div></section>'
  +'<section id="join" tabindex="-1"><div class="wrap"><div class="card formcard">'
  +  '<h2>'+esc(t('formTitle'))+'</h2><p class="hint" style="margin:0 0 18px">'+esc(t('formLead'))+'</p>'
  +  '<div id="status" role="status" tabindex="-1">'+(state.sent?'<p class="done">'+esc(t('done'))+'</p>':'')+'</div>'
  +  '<form id="waitlist" novalidate>'
  +    '<div class="field"><label for="f-email">'+esc(t('emailLabel'))+'</label>'

  +      (errE?'<p class="err" id="e-email">'+esc(t('errEmail'))+'</p>':'')+'</div>'
  +    '<div class="field"><label for="f-area">'+esc(t('areaLabel'))+' <span class="opt-note">'+esc(t('optional'))+'</span></label>'
  +      '<select id="f-area">'+opts(['areaMadrid','areaRegion','areaBcn','areaVlc','areaOther'])+'</select></div>'
  +    '<div class="field"><label for="f-when">'+esc(t('whenLabel'))+' <span class="opt-note">'+esc(t('optional'))+'</span></label>'
  +      '<select id="f-when">'+opts(['when1','when2','when3','when4'])+'</select></div>'
  +    '<div class="field"><div class="check"><input type="checkbox" id="f-consent" required'+(errC?' aria-invalid="true" aria-describedby="e-consent"':'')+'>'
  +      '<label for="f-consent" style="font-weight:400;margin:0">'+esc(t('consent'))+'</label></div>'
  +      (errC?'<p class="err" id="e-consent">'+esc(t('errConsent'))+'</p>':'')
  +      '<p class="hint" style="margin:8px 0 0">'+esc(t('privacyDraft'))+'</p></div>'
  +    '<button type="submit" class="btn primary">'+esc(t('submit'))+'</button>'
  +  '</form>'
  +'</div></div></section>'
  +'</main>'
  +'<footer class="foot"><div class="wrap"><p>'+esc(t('foot1'))+'</p><p>'+esc(t('foot2'))+'</p></div></footer>';
}
function render(){
  document.documentElement.setAttribute('lang',lang);
  document.title=t('title');
  var sk=document.getElementById('skip');if(sk)sk.textContent=t('skip');
  document.getElementById('app').innerHTML=view();
}
function focusId(id){var el=document.getElementById(id);if(el&&el.focus)el.focus();}
/* Validates, then throws the values away: nothing is stored, logged or sent. */
function submitForm(email,consent){
  state.errors=checkForm(email,consent);
  state.sent=state.errors.length===0;
  render();
  if(state.sent)focusId('status');else focusId(state.errors[0]==='email'?'f-email':'f-consent');
  return state.sent;
}
function switchLang(l){setLang(l);state.errors=[];render();focusId('lang-switch');}
document.addEventListener('click',function(e){
  var b=e.target&&e.target.closest&&e.target.closest('#lang-switch');
  if(b)switchLang(b.getAttribute('data-id'));
});
document.addEventListener('submit',function(e){
  e.preventDefault();
  var em=document.getElementById('f-email'),c=document.getElementById('f-consent');
  submitForm(em?em.value:'',c?c.checked:false);
});
(function init(){
  var m=/(?:^#|&)lang=(en|es)(?:&|$)/.exec(location.hash||'');
  setLang(m?m[1]:'es');
  render();
})();
window.__landing={get lang(){return lang;},state:state,setLang:switchLang,submit:submitForm,checkForm:checkForm,BRAND:BRAND};
</script>
</body>
</html>
