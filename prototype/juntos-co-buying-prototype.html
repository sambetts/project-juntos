<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Juntos – encuentra con quién comprar casa (prototipo)</title>
<style>
:root{
  --bg:#f5f6fa;--surface:#ffffff;--surface-2:#eef1f7;--text:#1b2230;--muted:#5b6476;--border:#dfe4ee;
  --brand:#b3370e;--brand-soft:#fff0e8;--brand-ink:#ffffff;--teal:#0f766e;--teal-soft:#e3f4f1;
  --good:#18794e;--good-bg:#e7f6ee;--warn:#9a5b00;--warn-bg:#fff4e0;--ring-track:#e6e9f0;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 6px 20px rgba(16,24,40,.07);--radius:16px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0e131b;--surface:#161d28;--surface-2:#1e2735;--text:#e8edf4;--muted:#9ba7b9;--border:#2a3546;
    --brand:#ff7a45;--brand-soft:#3a2216;--brand-ink:#1b1209;--teal:#4fd1c5;--teal-soft:#123230;
    --good:#5bd39b;--good-bg:#12302a;--warn:#f3b45f;--warn-bg:#382a14;--ring-track:#273246;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);}
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.45;font-size:15px;padding-block-end:88px}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1120px;margin-inline:auto;padding-inline:20px}
header.top{background:var(--surface);border-block-end:1px solid var(--border)}
header.top .wrap{display:flex;align-items:center;gap:14px;padding-block:14px;flex-wrap:wrap}
.logo{inline-size:42px;block-size:42px;border-radius:12px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;font-size:20px}
.brand h1{font-size:20px;margin:0}
.brand p{margin:0;color:var(--muted);font-size:13px}
.badge{margin-inline-start:auto;font-size:12px;color:var(--teal);background:var(--teal-soft);padding:6px 10px;border-radius:999px;font-weight:600}
nav.tabs{position:sticky;inset-block-start:0;z-index:5;background:var(--bg);border-block-end:1px solid var(--border)}
nav.tabs .wrap{display:flex;gap:8px;padding-block:10px;overflow-x:auto}
.tab{appearance:none;border:1px solid var(--border);background:var(--surface);padding:9px 14px;border-radius:999px;font-weight:600;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.tab .count{display:inline-block;min-inline-size:22px;padding:0 6px;margin-inline-start:8px;border-radius:999px;background:var(--brand);color:var(--brand-ink);font-size:12px;text-align:center}
main{padding-block:22px 28px}
h2{font-size:22px;margin:0 0 4px}
h3{font-size:16px;margin:0 0 12px}
h4{font-size:12.5px;margin:18px 0 8px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.lead{color:var(--muted);margin:0 0 18px}
.hint{color:var(--muted);font-size:13px}
.mt{margin-block-start:16px}
.mb{margin-block-end:22px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.grid{display:grid;gap:16px}
.cols-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.people{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.groups{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.presets{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.field{margin-block-end:16px}
.field:last-child{margin-block-end:0}
.label,.field>label[for]{display:block;font-weight:600;margin-block-end:8px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface-2);padding:8px 12px;border-radius:999px;cursor:pointer;user-select:none}
.opt input{accent-color:var(--brand);margin:0}
.opt:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
select{inline-size:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--border);background:var(--surface)}
.slider{margin-block-end:14px}
.slider label{display:block;font-weight:600;margin-block-end:4px}
.slider .ends{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}
input[type=range]{inline-size:100%;accent-color:var(--brand)}
.feat{display:flex;flex-wrap:wrap;gap:8px}
.fbtn{border:1px dashed var(--border);background:var(--surface);color:var(--muted);padding:8px 12px;border-radius:12px;cursor:pointer;text-align:start}
.fbtn small{display:block;font-size:11px;opacity:.9}
.fbtn[data-level="nice"]{border-style:solid;border-color:var(--teal);color:var(--teal);background:var(--teal-soft)}
.fbtn[data-level="must"]{border-style:solid;border-color:var(--brand);color:var(--brand);background:var(--brand-soft);font-weight:700}
.btn{appearance:none;border:1px solid var(--border);background:var(--surface);padding:10px 16px;border-radius:12px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:transparent}
.btn.small{padding:7px 12px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.spacer{flex:1}
.actionbar{position:fixed;inset-inline:0;inset-block-end:0;background:var(--surface);border-block-start:1px solid var(--border);box-shadow:0 -6px 20px rgba(16,24,40,.08);z-index:6}
.actionbar .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.stat{font-weight:700}
.stat span{color:var(--muted);font-weight:400}
.pcard{display:flex;flex-direction:column;gap:12px}
.phead{display:flex;gap:12px;align-items:center}
.avatar{border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:700;flex:none}
.pname{font-weight:700;font-size:16px}
.psub{color:var(--muted);font-size:13px}
.ring{--p:0;inline-size:60px;block-size:60px;border-radius:50%;background:conic-gradient(var(--rc) calc(var(--p) * 1%),var(--ring-track) 0);display:grid;place-items:center;margin-inline-start:auto;flex:none}
.ring b{inline-size:46px;block-size:46px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:14px}
.ring.hi{--rc:var(--good)}
.ring.mid{--rc:var(--teal)}
.ring.lo{--rc:var(--warn)}
.bio{margin:0;font-size:14px}
.facts,.chips{display:flex;flex-wrap:wrap;gap:6px}
.fact{font-size:12px;background:var(--surface-2);border-radius:8px;padding:4px 8px;color:var(--muted)}
.chip{font-size:12.5px;padding:5px 9px;border-radius:999px;line-height:1.25}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.together{font-size:13px;background:var(--surface-2);border-radius:10px;padding:8px 10px}
.pactions{display:flex;gap:8px;align-items:center;margin-block-start:auto}
.status{font-size:13px;font-weight:700}
.status.ok{color:var(--good)}
.status.wait{color:var(--muted)}
details summary{cursor:pointer}
details.why summary{color:var(--muted);font-size:13px}
.bars{display:grid;gap:6px;margin-block-start:8px}
.bar{display:grid;grid-template-columns:118px 1fr 40px;gap:8px;align-items:center;font-size:12.5px}
.bar .track{block-size:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar .fill{block-size:100%;background:var(--teal);border-radius:999px}
.pcard.passed{opacity:.55}
.gcard{display:flex;flex-direction:column;gap:10px}
.stack{display:flex}
.stack .avatar{border:2px solid var(--surface);margin-inline-start:-8px}
.stack .avatar:first-child{margin-inline-start:0}
.gscore{font-size:28px;font-weight:800}
.members{display:flex;flex-wrap:wrap;gap:10px}
.member{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:999px;padding-block:6px;padding-inline:6px 12px}
.member .x{border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:0 2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kpi{background:var(--surface-2);border-radius:12px;padding:12px}
.kpi .v{font-size:22px;font-weight:800}
.kpi .k{color:var(--muted);font-size:12.5px}
.headline{font-size:18px;font-weight:700;margin:0 0 12px}
.scroll{overflow-x:auto}
table.matrix{border-collapse:collapse;font-size:13px;margin-block-start:14px}
.matrix th,.matrix td{padding:6px 9px;text-align:center;border:1px solid var(--border);white-space:nowrap}
.c-hi{background:var(--good-bg);color:var(--good);font-weight:700}
.c-mid{background:var(--teal-soft);color:var(--teal);font-weight:700}
.c-lo{background:var(--warn-bg);color:var(--warn);font-weight:700}
.c-self{color:var(--muted)}
ul.clean{list-style:none;padding:0;margin:0;display:grid;gap:10px}
ul.clean li{display:flex;gap:10px;align-items:flex-start}
.tag{font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;white-space:nowrap;flex:none}
.tag.must{background:var(--brand-soft);color:var(--brand)}
.tag.nice{background:var(--teal-soft);color:var(--teal)}
.tag.tip{background:var(--surface-2);color:var(--muted)}
.who{color:var(--muted);font-size:12.5px}
.split{display:flex;block-size:14px;border-radius:999px;overflow:hidden;margin-block:4px 12px}
.split span{display:block;block-size:100%}
.warnbox{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.empty{text-align:center;padding:40px 20px}
.toast{position:fixed;inset-inline:0;inset-block-start:16px;display:flex;justify-content:center;pointer-events:none;z-index:20;padding-inline:16px}
.toast div{background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;box-shadow:var(--shadow);font-weight:600;opacity:0;transform:translateY(-8px);transition:opacity .25s,transform .25s;max-inline-size:640px}
.toast div.show{opacity:1;transform:none}
footer.note{color:var(--muted);font-size:12.5px;padding-block:4px 24px}
.sr{position:absolute;inline-size:1px;block-size:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.notice{background:var(--teal-soft);border-color:transparent}
.notice .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-block-start:10px}
.range-edit{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.range-edit input{inline-size:96px;padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:var(--surface)}
.stat .warnline{color:var(--warn);font-weight:700}
@media (max-width:640px){.bar{grid-template-columns:96px 1fr 36px}h2{font-size:19px}.badge{margin-inline-start:0}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><div class="logo" aria-hidden="true">J</div><div class="brand"><h1>Juntos</h1><p id="tagline"></p></div><span class="badge" id="badge"></span><button type="button" class="btn small" id="lang-switch" data-action="lang"></button></div></header>
<nav class="tabs" id="steps"><div class="wrap" id="tabs" role="tablist"></div></nav>
<main class="wrap" id="app" role="tabpanel" aria-labelledby="tab-you"></main>
<footer class="wrap note" id="footnote"></footer>
<div id="actionbar" class="actionbar"><div class="wrap"></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"><div></div></div>
<script>
(function(){
'use strict';
window.addEventListener('error',function(e){document.documentElement.setAttribute('data-error',String(e.message));});
/* ===== LOGIC START ===== */
/* Language: 'es' (Spanish, Spain) or 'en'. Every word users see comes from STR or a {en,es} label. */
let LANG='es';
function setLang(l){LANG=l==='en'?'en':'es';return LANG;}
function tx(v){return v&&typeof v==='object'?(v[LANG]!==undefined?v[LANG]:v.es):(v===undefined?'':v);}
function t(k){const v=STR[LANG][k]!==undefined?STR[LANG][k]:STR.es[k];return typeof v==='function'?v.apply(null,Array.prototype.slice.call(arguments,1)):v;}
function pl(n,one,many){return n+' '+(n===1?one:many);}

const MAX_BEDROOMS=6;
const AREAS=[
  {id:'centre',label:{en:'Central Madrid',es:'Madrid centro'},hint:{en:'inside the M-30',es:'dentro de la M-30'}},
  {id:'city',label:{en:'Rest of Madrid city',es:'Resto de Madrid capital'},hint:{en:'outside the M-30',es:'fuera de la M-30'}},
  {id:'north',label:{en:'North & west towns',es:'Municipios del norte y oeste'},hint:'Las Rozas, Pozuelo, Alcobendas, Tres Cantos'},
  {id:'south',label:{en:'South towns',es:'Municipios del sur'},hint:'Getafe, Leganés, Alcorcón, Móstoles'},
  {id:'east',label:{en:'East corridor',es:'Corredor del Henares'},hint:'Alcalá, Torrejón, Coslada'}
];
const TYPES=[{id:'flat',label:{en:'Flat',es:'Piso'},hint:{en:'piso',es:''}},{id:'house',label:{en:'House',es:'Casa'},hint:{en:'chalet or adosado',es:'chalet o adosado'}}];
const HOUSEHOLDS=[
  {id:'single',label:{en:'Single',es:'Persona sola'},plural:{en:'singles',es:'personas solas'}},
  {id:'couple',label:{en:'Couple',es:'Pareja'},plural:{en:'couples',es:'parejas'}},
  {id:'family',label:{en:'Family with kids',es:'Familia con hijos'},plural:{en:'families with kids',es:'familias con hijos'}},

];

  {id:'parking',label:{en:'Parking / driveway',es:'Garaje o plaza de aparcamiento'}},
  {id:'garden',label:{en:'Garden',es:'Jardín'}},
  {id:'terrace',label:{en:'Terrace or balcony',es:'Terraza o balcón'}},
  {id:'pool',label:{en:'Shared pool',es:'Piscina comunitaria'}},
  {id:'lift',label:{en:'Lift',es:'Ascensor'}},
  {id:'stepfree',label:{en:'Step-free access',es:'Acceso sin escalones'}},

  {id:'quiet',label:{en:'Quiet street',es:'Calle tranquila'}},
  {id:'storage',label:{en:'Storage room (trastero)',es:'Trastero'}}
];
const HORIZONS=[{id:'2-4',label:{en:'2–4 years',es:'2–4 años'}},{id:'5-9',label:{en:'5–9 years',es:'5–9 años'}},{id:'10+',label:{en:'10+ years',es:'10 años o más'}}];
const SLIDERS=[
  {id:'sleep',label:{en:'Daily rhythm',es:'Ritmo diario'},lo:{en:'Early bird',es:'Madrugar'},hi:{en:'Night owl',es:'Trasnochar'},w:0.25},
  {id:'tidy',label:{en:'Tidiness',es:'Orden'},lo:{en:'Relaxed',es:'Flexible'},hi:{en:'Very tidy',es:'Muy exigente'},w:0.25},
  {id:'social',label:{en:'Home atmosphere',es:'Ambiente en casa'},lo:{en:'Quiet',es:'Tranquilo'},hi:{en:'Lively',es:'Animado'},w:0.20},
  {id:'guests',label:{en:'Guests over',es:'Visitas'},lo:{en:'Rarely',es:'Casi nunca'},hi:{en:'Often',es:'A menudo'},w:0.15},
  {id:'meals',label:{en:'Meals',es:'Comidas'},lo:{en:'Own thing',es:'Cada cual a su aire'},hi:{en:'Cook and eat together',es:'Cocinar y comer en compañía'},w:0.15}
];
const WEIGHTS={lifestyle:0.50,place:0.20,plans:0.20,home:0.10};
const PART_LABELS={lifestyle:{en:'How you live',es:'Forma de vivir'},place:{en:'Where & what',es:'Dónde y qué'},plans:{en:'Time horizon',es:'Horizonte'},home:{en:'Shared priorities',es:'Prioridades comunes'}};
const ACCESS_FEATURES=['lift','stepfree'];
const NUM_FIELDS=['bedrooms','kids','cars','maxHouseholds','sleep','tidy','social','guests','meals'];
const PET_WORDS={dog:{en:'a dog',es:'un perro'},cat:{en:'a cat',es:'un gato'}};

/* Every sentence users see, in both languages. Spanish uses tú for the user and vosotros for the group, and avoids gendered words where it can. */
const STR={
en:{
  and:'and',or:'or',you:'you',youName:'You',vs:'vs',
  title:'Juntos – find the people to buy a home with (prototype)',
  tagline:'Find the people to buy a home with (working name)',
  badge:'Prototype · made-up people · simulated replies · Madrid',
  footnote:'Prototype with made-up people and simulated replies. It covers matching and space only: money, ownership shares, the co-ownership agreement and real listings come later. Matching never uses protected traits such as age, sex, origin, religion, sexual orientation or health. Whether a real service may let people choose by household type is being checked with a lawyer.',
  steps:'Steps',langOther:'Español',langOtherCode:'es',langOtherAria:'Ver en español',tLang:'Showing the English version',
  kids:n=>pl(n,'kid','kids'),
  hhFamily:(a,k)=>'Family · '+a+' adults + '+k,hhSingleParent:k=>'Single parent + '+k,
  typeBoth:'flat or house',typeNone:'home',
  homeLine:(type,beds)=>beds+'-bedroom '+type,
  bedroomsN:n=>pl(n,'bedroom','bedrooms'),bathsN:n=>pl(n,'bathroom','bathrooms'),parkingN:n=>'parking for '+n,parkingSpaces:n=>pl(n,'parking space','parking spaces'),
  notOpen:p=>"You're not looking to share with "+p,smokeIn:'They smoke indoors',smokeOut:"They smoke outside, and you'd rather nobody smoked",
  petsNo:p=>'They have '+p+', and you said no pets',pickArea:'Pick at least one area',noArea:l=>'No area in common (they want '+l+')',
  pickType:'Pick at least one type of home',onlyType:l=>'They only want a '+l,
  bedsPair:(b,m)=>'Together you would need '+b+' bedrooms; this prototype caps a home at '+m,
  theirsPrivate:"Doesn't fit their own preferences (their reasons stay private)",
  has:p=>'Has '+p,smokesOut:'Smokes (outside only)',smokesIn:'Smokes indoors',
  bothLarks:'Both early birds',bothOwls:'Both night owls',similarRhythm:'Similar daily rhythm',lateHours:'Keeps late hours',veryEarly:'Up very early',
  similarTidy:'Similar tidiness',tidier:'Tidier than you',relaxed:'More relaxed about tidiness',
  cookTogether:'Both love cooking together',ownMeals:'Both like their own mealtimes',mealsDiffer:'Different ideas about shared meals',
  guestsOften:'Often has guests over',guestsRarely:'Rarely has guests over',likesLively:'Likes a lively home',likesQuiet:'Likes a quiet home',
  youWfh:'You work from home; they like a lively home',theyWfh:'They work from home; you like a lively home',
  sameHorizon:l=>'Both planning '+l,diffHorizon:(a,b)=>'Different time horizons ('+a+' vs '+b+')',bothWant:f=>'Both want: '+f,kidsInHome:k=>k+' in the household',
  maxHH:(m,n)=>'At most '+m+' households in the home, for '+n,bedsGroup:(b,m)=>'That needs '+b+' bedrooms; this prototype caps a home at '+m,
  clash:p=>p+' clash on a dealbreaker',noAreaAll:'No area that everyone accepts',noTypeAll:'No type of home that everyone accepts',
  twice:'Someone is listed twice',notMutual:n=>n+" isn't a mutual match with you any more",othersReject:p=>p+" wouldn't both accept each other (simulated)",
  secondLiving:'A second living space (a snug or playroom)',secondWhyKidless:'Gives the adults without kids a calm space while the kids play',secondWhy:'Lets each household have its own downtime',
  bigKitchen:'A big kitchen-diner',bigKitchenWhy:'Most of you like cooking and eating together',
  twoKitchen:'A kitchen where two households can cook at once, with separate fridge shelves',twoKitchenWhy:'You mostly cook your own meals',
  desks:n=>n===1?'A quiet workspace':n+' quiet workspaces',wfhWho:n=>'Working from home: '+n,
  outdoor:'Outdoor space or a park nearby',dogWho:n=>'Dog owners: '+n,
  guestWC:'A guest WC near the living area',guestWCWhy:'Everyone has their own bathroom, so visitors need one',
  keepYours:'Keep your rooms together, ideally on one floor or in one wing.',keepTheirs:n=>'Keep '+n+"'s rooms together, ideally on one floor or in one wing.",
  clusters:n=>'Give each household with several rooms ('+n+') its own cluster: one floor or one wing each.',
  owlsLarks:(o,l)=>'Night owls ('+o+') and early birds ('+l+'): put their bedrooms at opposite ends or on different floors.',
  wfhAway:many=>'Keep the workspace'+(many?'s':'')+' away from the kids’ rooms and the playroom.',
  ensuite:n=>'En-suite bedrooms: '+n+'; the others share a bathroom.',similarNeeds:'Your needs are similar, so draw lots or take turns for first pick of rooms.',
  agCleaning:['Cleaning','A rota, or a cleaner shared between households?','Your tidiness standards differ'],
  agGuests:['Guests','How often people can stay over, and how much notice to give','Very different habits with guests'],
  agHours:['Early & late','Showers, kitchen use and noise late at night or early in the morning','Night owls and early birds under one roof'],
  agQuiet:['Quiet hours','For example 23:00 to 08:00, plus quiet during home-working hours','Lively and quiet people sharing'],
  agFood:['Food','Shared staples or separate shelves? Any regular shared dinners?','Different ideas about shared meals'],
  agPets:['Pets','Which spaces pets can use, and who covers any damage',''],petWho:n=>'Pet owners: '+n,
  agSmoking:['Smoking','Where it is allowed (garden or terrace only?)',''],smokerWho:n=>'Smokers: '+n,
  agKids:['Kids','Noisy-play times, toys in shared spaces, any babysitting swaps','There will be kids in the house'],
  agParking:['Parking','Who uses which space, and where visitors park',''],carsTotal:n=>n+' cars between you',
  agGarden:['Garden & pool','Who looks after them, and when you pay someone instead','You want outdoor space'],
  agDecisions:['Decisions','How you decide on repairs and changes, with a tie-break if you split down the middle','Every group needs this'],
  agExit:['Moving on','Notice period, and how the group chooses a new co-owner','Money and legal detail come later; agree the principle now'],
  tabYou:'1 · Your profile',tabMatches:'2 · Matches',tabHome:'3 · Your home together',srCompatible:'compatible',srInGroup:'households in your group',
  profileH:'Your profile',profileLead:'Who is buying, how you live and what the home needs. Your matches update as you go.',startFrom:'Start from an example:',
  whoBuying:"Who's buying",yourHousehold:'Your household',kidsLabel:'Kids',privateSpace:'Your private space',bedroomsLabel:'Bedrooms just for your household',

/* Spanish: "y" becomes "e" before an /i/ sound (Irene, hijos) and "o" becomes "u" before an /o/ sound */
function conj(word,next){if(LANG!=='es')return word;const s=String(next).toLowerCase();if(word==='y'&&/^h?[ií](?![aeiouáéó])/.test(s))return 'e';if(word==='o'&&/^h?[oó]/.test(s))return 'u';return word;}

/* Dealbreakers: checked both ways, from a's point of view. The other side's reasons stay private. */
function hard(a,b){
  const mine=[],theirs=[],both=[];
  if(a.open.indexOf(b.household)<0)mine.push(t('notOpen',tx(hh(b.household).plural)));
  if(b.open.indexOf(a.household)<0)theirs.push('household');
  if(!smokeAccepts(a.acceptsSmoking,b.smoking))mine.push(b.smoking==='inside'?t('smokeIn'):t('smokeOut'));
  if(!smokeAccepts(b.acceptsSmoking,a.smoking))theirs.push('smoking');
  if(!petsOk(a.acceptsPets,b.pets))mine.push(t('petsNo',petText(b.pets)));
  if(!petsOk(b.acceptsPets,a.pets))theirs.push('pets');
  if(!a.areas.length)mine.push(t('pickArea'));
  else if(!inter(a.areas,b.areas).length)both.push(t('noArea',listOr(b.areas.map(areaLabel))));
  if(!a.types.length)mine.push(t('pickType'));
  else if(!inter(a.types,b.types).length)both.push(t('onlyType',listOr(b.types.map(x=>typeLabel(x).toLowerCase()))));
  const beds=a.bedrooms+b.bedrooms;
  if(beds>MAX_BEDROOMS)both.push(t('bedsPair',beds,MAX_BEDROOMS));
  const reasons=mine.concat(both);
  if(theirs.length)reasons.push(t('theirsPrivate'));
  return {ok:!(mine.length||theirs.length||both.length),reasons:reasons,mine:mine,theirs:theirs,both:both};
}

/* Shared priorities for the home. Accessibility needs are left out: they shape the brief, never the score. No wish-list is neutral. */
function homeScore(a,b){
  const keys=x=>Object.keys(x.needs).filter(f=>ACCESS_FEATURES.indexOf(f)<0);
  const na=keys(a),nb=keys(b);
  if(!na.length||!nb.length)return {v:0.75,both:[]};
  const both=na.filter(f=>nb.indexOf(f)>=0);
  const w=f=>(a.needs[f]==='must'&&b.needs[f]==='must')?1:((a.needs[f]==='must'||b.needs[f]==='must')?0.75:0.5);
  return {v:0.75+0.25*Math.min(1,sum(both,w)/Math.min(na.length,nb.length)),both:both};
}

/* Demo compatibility score, 0-100. The weights are an uncalibrated first guess; household type is not scored. */
function score(a,b){
  let life=0;
  SLIDERS.forEach(s=>{life+=s.w*(1-Math.abs(a[s.id]-b[s.id])/4);});
  const wfhClash=(a.wfh&&b.social>=4)||(b.wfh&&a.social>=4);
  if(wfhClash)life-=0.08;
  life=clamp(life,0,1);
  const ai=inter(a.areas,b.areas).length,ti=inter(a.types,b.types).length;
  const areaS=ai/Math.max(1,Math.min(a.areas.length,b.areas.length));
  const typeS=ti/Math.max(1,Math.min(a.types.length,b.types.length));
  const place=0.7*areaS+0.3*typeS;
  const pv=[1,0.6,0.2][Math.abs(hIndex(a)-hIndex(b))];
  const plans=pv===undefined?0.2:pv;
  const hs=homeScore(a,b);
  const parts={lifestyle:life,place:place,plans:plans,home:hs.v};
  let tot=0;Object.keys(WEIGHTS).forEach(k=>{tot+=WEIGHTS[k]*parts[k];});
  return {total:Math.round(100*tot),parts:parts,both:hs.both,wfhClash:wfhClash};
}

/* Why you click / what to talk about, from u's point of view */

  if(d('sleep')<=1)clicks.push(u.sleep<=2&&p.sleep<=2?t('bothLarks'):(u.sleep>=4&&p.sleep>=4?t('bothOwls'):t('similarRhythm')));
  else if(d('sleep')>=3)talks.push(p.sleep>u.sleep?t('lateHours'):t('veryEarly'));
  if(d('tidy')<=1)clicks.push(t('similarTidy'));
  else if(d('tidy')>=2)talks.push(p.tidy>u.tidy?t('tidier'):t('relaxed'));
  if(u.meals>=4&&p.meals>=4)clicks.push(t('cookTogether'));
  else if(u.meals<=2&&p.meals<=2)clicks.push(t('ownMeals'));
  else if(d('meals')>=3)talks.push(t('mealsDiffer'));
  if(d('guests')>=3)talks.push(p.guests>u.guests?t('guestsOften'):t('guestsRarely'));
  if(d('social')>=3)talks.push(p.social>u.social?t('likesLively'):t('likesQuiet'));
  if(u.wfh&&p.social>=4)talks.push(t('youWfh'));
  else if(p.wfh&&u.social>=4)talks.push(t('theyWfh'));
  const hd=Math.abs(hIndex(u)-hIndex(p));
  if(hd===0)clicks.push(t('sameHorizon',hLabel(u)));

  sc.both.slice(0,2).forEach(f=>clicks.push(t('bothWant',featLabel(f))));
  if(p.kids>0&&u.kids===0)talks.push(t('kidsInHome',t('kids',p.kids)));
  return {score:sc,clicks:clicks.slice(0,4),talks:talks.slice(0,4)};
}

/* Consent. Your side is always your explicit like. The made-up people's replies are simulated from their own settings:
   someone accepts you if no dealbreaker applies and the score meets their pickiness. */
function accepts(a,b){return hard(a,b).ok&&score(a,b).total>=a.pickiness;}
function likesBack(u,p){return accepts(p,u);}
function mutual(u,p,liked){return !!(liked&&liked[p.id])&&likesBack(u,p);}
function othersAccept(others){
  for(let i=0;i<others.length;i++)for(let j=i+1;j<others.length;j++){
    if(!accepts(others[i],others[j])||!accepts(others[j],others[i]))return {ok:false,a:others[i],b:others[j]};
  }

}
function groupMembers(user,ids){return [user].concat(ids.map(byId).filter(Boolean));}

function groupCheck(all){
  const issues=[];
  const maxH=Math.min.apply(null,all.map(m=>m.maxHouseholds));
  if(all.length>maxH){const w=all.filter(m=>m.maxHouseholds===maxH);issues.push(t('maxHH',maxH,names(w)));}
  const beds=sum(all,m=>m.bedrooms);
  if(beds>MAX_BEDROOMS)issues.push(t('bedsGroup',beds,MAX_BEDROOMS));
  for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++){
    const h=hard(all[i],all[j]);
    if(!h.ok)issues.push(all[i].id==='you'?(all[j].name+': '+h.reasons[0]):t('clash',listAnd([all[i].name,all[j].name])));
  }
  if(!all.reduce((acc,m)=>inter(acc,m.areas),AREAS.map(a=>a.id)).length)issues.push(t('noAreaAll'));
  if(!all.reduce((acc,m)=>inter(acc,m.types),TYPES.map(x=>x.id)).length)issues.push(t('noTypeAll'));
  return {ok:!issues.length,issues:issues};
}

/* Can this group stand? Everyone must be a mutual match with you, accept each other, and pass the whole-group checks. */
function groupStatus(user,ids,liked){
  const issues=[],seen={};
  ids.forEach(id=>{if(seen[id])issues.push(t('twice'));seen[id]=1;});
  const others=ids.map(byId).filter(Boolean);
  others.forEach(p=>{if(!mutual(user,p,liked))issues.push(t('notMutual',p.name));});
  const oa=othersAccept(others);
  if(!oa.ok)issues.push(t('othersReject',listAnd([oa.a.name,oa.b.name])));
  const all=issues.concat(groupCheck([user].concat(others)).issues);
  return {ok:!all.length,issues:all};
}

function groupScore(all){
  const pairs=[];
  for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++)pairs.push({a:all[i],b:all[j],s:score(all[i],all[j]).total});
  if(!pairs.length)return {min:0,avg:0,pairs:pairs,weakest:null};
  let w=pairs[0];pairs.forEach(p=>{if(p.s<w.s)w=p;});
  return {min:w.s,avg:Math.round(sum(pairs,p=>p.s)/pairs.length),pairs:pairs,weakest:w};
}

/* Best whole groups, from your mutual matches only; everyone must accept each other.

function rankGroups(x,y){return (y.min-x.min)||(y.avg-x.avg)||(x.size-y.size);}
function bestGroups(user,liked,exclude,limit){
  liked=liked||{};exclude=exclude||[];limit=limit||3;
  const c=PROFILES.filter(p=>exclude.indexOf(p.id)<0&&mutual(user,p,liked));
  const maxOthers=Math.max(0,Math.min(3,user.maxHouseholds-1));
  const out=[];
  const consider=others=>{const all=[user].concat(others);if(!groupCheck(all).ok||!othersAccept(others).ok)return;const gs=groupScore(all);out.push({ids:others.map(o=>o.id),min:gs.min,avg:gs.avg,size:all.length});};
  for(let i=0;i<c.length;i++){
    if(maxOthers>=1)consider([c[i]]);
    for(let j=i+1;j<c.length;j++){
      if(maxOthers>=2)consider([c[i],c[j]]);
      for(let k=j+1;k<c.length;k++){if(maxOthers>=3)consider([c[i],c[j],c[k]]);}
    }
  }

  const best=[];out.forEach(g=>{if(!best.some(b=>b.size===g.size))best.push(g);});
  return best.slice(0,limit);

function topGroup(groups){return groups&&groups.length?groups.slice().sort(rankGroups)[0]:null;}

/* What the shared home needs */
function houseBrief(all){
  const beds=sum(all,m=>m.bedrooms);

  const sharers=all.filter(m=>!m.privateBath);
  const sharedBaths=sharers.length?Math.max(1,Math.ceil(sum(sharers,m=>m.adults+m.kids)/4)):0;
  const baths=Math.max(1,privateBaths+sharedBaths);
  const cars=sum(all,m=>m.cars);
  const wfh=all.filter(m=>m.wfh);
  const kids=sum(all,m=>m.kids),adults=sum(all,m=>m.adults);

  const types=all.reduce((acc,m)=>inter(acc,m.types),TYPES.map(x=>x.id));
  const feats=FEATURES.map(f=>{
    const must=all.filter(m=>m.needs[f.id]==='must'),nice=all.filter(m=>m.needs[f.id]==='nice');
    return {f:f,level:must.length?'must':(nice.length?'nice':''),must:must,nice:nice};
  }).filter(x=>x.level);
  const extras=[];

  const avgMeals=sum(all,m=>m.meals)/all.length;
  if(avgMeals>=3.5)extras.push({label:t('bigKitchen'),why:t('bigKitchenWhy')});
  else if(all.length>=2)extras.push({label:t('twoKitchen'),why:t('twoKitchenWhy')});

  const guestWC=privateBaths===all.length&&all.length>=2;
  if(guestWC)extras.push({label:t('guestWC'),why:t('guestWCWhy')});
  const est=(beds*12+baths*5+30+12+wfh.length*5+(second?12:0)+(guestWC?3:0))*1.15,r5=x=>Math.round(x/5)*5;
  const m2=r5(est),m2min=r5(est*0.9),m2max=r5(est*1.1);

}

function placementTips(all){

function agreementTopics(all){
  const r=[],ag=(k,why)=>{const a=t(k);r.push({topic:a[0],q:a[1],why:why||a[2]});};
  const rng=k=>Math.max.apply(null,all.map(m=>m[k]))-Math.min.apply(null,all.map(m=>m[k]));
  if(rng('tidy')>=2)ag('agCleaning');
  if(rng('guests')>=3)ag('agGuests');
  if(rng('sleep')>=3)ag('agHours');
  const wfh=all.filter(m=>m.wfh);
  if(rng('social')>=3||wfh.length)ag('agQuiet',wfh.length?t('wfhWho',names(wfh)):'');
  if(rng('meals')>=3)ag('agFood');
  const petOwners=all.filter(m=>m.pets.length);
  if(petOwners.length)ag('agPets',t('petWho',names(petOwners)));
  const smokers=all.filter(m=>m.smoking!=='no');
  if(smokers.length)ag('agSmoking',t('smokerWho',names(smokers)));
  if(all.some(m=>m.kids>0))ag('agKids');
  const cars=sum(all,m=>m.cars);
  if(cars>=2)ag('agParking',t('carsTotal',cars));
  if(all.some(m=>m.needs.garden||m.needs.pool))ag('agGarden');
  ag('agDecisions');
  ag('agExit');
  return r;
}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);}
function clone(o){return JSON.parse(JSON.stringify(o));}
function fresh(preset){return {tab:'you',lang:LANG,preset:preset,user:clone(PRESETS[preset].user),likes:{},passes:{},group:[],sizeTarget:{}};}
function load(){
  try{
    const s=JSON.parse(localStorage.getItem(KEY)||'null');
    if(s&&s.user&&s.user.id==='you'){
      s.user=P(s.user);s.likes=s.likes||{};s.passes=s.passes||{};
      s.group=(s.group||[]).filter((id,i,a)=>!!byId(id)&&a.indexOf(id)===i);s.sizeTarget=s.sizeTarget||{};
      if(['you','matches','home'].indexOf(s.tab)<0)s.tab='you';
      return s;
    }
  }catch(e){}

}

function applyHash(){
  let h;try{h=new URLSearchParams((location.hash||'').replace(/^#/,''));}catch(e){return;}
  const lg=h.get('lang');if(lg==='en'||lg==='es')setLang(lg);
  const pr=h.get('preset');if(pr&&PRESETS[pr])state=fresh(pr);
  if(h.get('like')==='all')lists().ok.forEach(o=>{state.likes[o.p.id]=true;});
  if(h.get('group')==='best'){const g=topGroup(bestGroups(state.user,state.likes,Object.keys(state.passes),3));if(g)state.group=g.ids.slice();}
  const tb=h.get('tab');if(tb==='you'||tb==='matches'||tb==='home')state.tab=tb;
}
function lists(){
  const u=state.user,ok=[],hidden=[];
  PROFILES.forEach(p=>{const h=hard(u,p);if(h.ok)ok.push({p:p,ex:explain(u,p)});else hidden.push({p:p,reasons:h.reasons});});
  ok.sort((a,b)=>b.ex.score.total-a.ex.score.total);
  return {ok:ok,hidden:hidden};
}

function renderBar(){
  const L=lists(),g=1+state.group.length;let h;
  const bad=state.group.length>0&&!groupStatus(state.user,state.group,state.likes).ok;
  if(state.tab==='you')h=`<div class="stat">${t('barYou',L.ok.length,L.hidden.length)}${bad?` <span class="warnline">${t('attention')}</span>`:''}</div><span class="spacer"></span><button type="button" class="btn primary" data-action="goto" data-id="matches">${t('seeMatches')}</button>`;
  else if(state.tab==='matches')h=`<div class="stat">${t('barGroup',g,Object.keys(state.likes).length)}</div><span class="spacer"></span><button type="button" class="btn primary" data-action="goto" data-id="home"${g<2?' disabled':''}>${t('seeHome')}</button>`;
  else h=`<button type="button" class="btn" data-action="goto" data-id="you">${t('editProfile')}</button><span class="spacer"></span><button type="button" class="btn primary" data-action="goto" data-id="matches">${t('backMatches')}</button>`;
  barEl.innerHTML=h;
}
function render(){
  renderChrome();
  renderTabs();
  app.innerHTML=state.tab==='you'?viewYou():(state.tab==='matches'?viewMatches():viewHome());
  renderBar();
  save();
}
/* Keep keyboard focus in place when the page redraws */
function focusKey(){const a=document.activeElement;if(!a||a===document.body||!a.getAttribute)return null;return {action:a.getAttribute('data-action'),id:a.getAttribute('data-id'),tab:a.getAttribute('data-tab'),elId:a.id};}
function focusHeading(){const h=document.querySelector('#app h2');if(h){h.setAttribute('tabindex','-1');if(h.focus)h.focus();}}
function focusTab(){const b=document.getElementById('tab-'+state.tab);if(b&&b.focus)b.focus();}
function restoreFocus(k){
  if(!k)return;
  let el=null;
  if(k.tab){focusTab();return;}
  if(k.elId==='lang-switch')el=document.getElementById('lang-switch');
  else if(k.id)el=document.querySelector('[data-action="'+k.action+'"][data-id="'+k.id+'"]')||document.querySelector('#app [data-id="'+k.id+'"]');
  else if(k.action)el=document.querySelector('[data-action="'+k.action+'"]');
  if(el&&el.focus)el.focus({preventScroll:true});else focusHeading();
}
function rerender(){const y=window.scrollY||0,k=focusKey();render();window.scrollTo(0,y);restoreFocus(k);}
function go(tab){if(tab!=='home')preview=null;state.tab=tab;render();window.scrollTo(0,0);}
function profileChanged(){renderTabs();renderBar();app.querySelectorAll('[data-action="preset"]').forEach(b=>b.classList.remove('primary'));save();}

let toastTimer=0;
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),2800);}
function switchLang(l){setLang(l);rerender();toast(t('tLang'));}
function like(id){
  const p=byId(id);if(!p)return;
  state.likes[id]=true;delete state.passes[id];
  toast(likesBack(state.user,p)?t('tMutual',p.name):t('tNoMatch',p.name));
  rerender();
}
function addToGroup(id){
  const p=byId(id);if(!p)return;
  if(state.group.indexOf(id)>=0){toast(t('tAlready',p.name));return;}
  const st=groupStatus(state.user,state.group.concat([id]),state.likes);
  if(!st.ok){toast(t('tCantAdd',p.name,st.issues[0]));return;}
  state.group.push(id);rerender();toast(t('tAdded',p.name));
}
function proposeGroup(ids){
  ids=ids.filter((id,i)=>!!byId(id)&&ids.indexOf(id)===i);
  const st=groupStatus(state.user,ids,state.likes);
  if(!ids.length||!st.ok){toast(t('tCantForm',st.issues[0]||t('pickOne')));return;}
  state.group=ids.slice();preview=null;go('home');focusHeading();toast(t('tFormed'));
}
function cycleFeature(btn,id){
  const order=['none','nice','must'],cur=state.user.needs[id]||'none',nx=order[(order.indexOf(cur)+1)%3];
  if(nx==='none')delete state.user.needs[id];else state.user.needs[id]=nx;
  btn.outerHTML=featBtn(FEATURES.find(f=>f.id===id),state.user.needs[id]);
  state.preset=null;profileChanged();
}

/* ---------- events ---------- */
app.addEventListener('change',e=>{
  const el=e.target;
  if(el.hasAttribute('data-size')){
    const key=el.getAttribute('data-key'),cur=state.sizeTarget[key]||{};let mn=cur.min,mx=cur.max;
    app.querySelectorAll('input[data-size]').forEach(x=>{const v=parseInt(x.value,10);if(isNaN(v))return;if(x.getAttribute('data-size')==='min')mn=v;else mx=v;});
    if(mn>mx){const tmp=mn;mn=mx;mx=tmp;}
    state.sizeTarget[key]={min:mn,max:mx};save();return;
  }
  const f=el.getAttribute('data-field');if(!f)return;
  const u=state.user;
  if(el.hasAttribute('data-multi'))u[f]=Array.prototype.map.call(app.querySelectorAll('input[data-field="'+f+'"]:checked'),x=>x.value);
  else if(el.hasAttribute('data-bool'))u[f]=el.checked;
  else if(NUM_FIELDS.indexOf(f)>=0)u[f]=parseInt(el.value,10);
  else u[f]=el.value;
  state.preset=null;
  if(f==='household'){
    if(u.household==='family'){u.adults=2;if(u.kids<1)u.kids=1;}
    else if(u.household==='singleParent'){u.adults=1;if(u.kids<1)u.kids=1;}
    else if(u.household==='couple'){u.adults=2;u.kids=0;}
    else{u.adults=1;u.kids=0;}
    rerender();return;
  }
  profileChanged();
});
app.addEventListener('input',e=>{const el=e.target;if(el.type==='range'){state.user[el.getAttribute('data-field')]=parseInt(el.value,10);state.preset=null;profileChanged();}});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action],[data-tab]');if(!el||el.disabled)return;
  if(el.hasAttribute('data-tab')){go(el.getAttribute('data-tab'));focusTab();return;}
  const id=el.getAttribute('data-id');
  switch(el.getAttribute('data-action')){
    case 'lang':switchLang(id);break;
    case 'preset':state=fresh(id);preview=null;render();window.scrollTo(0,0);toast(t('tExample',tx(PRESETS[id].label)));break;
    case 'feat':cycleFeature(el,id);break;
    case 'goto':go(id);focusHeading();break;
    case 'like':like(id);break;
    case 'pass':state.passes[id]=true;delete state.likes[id];state.group=state.group.filter(x=>x!==id);rerender();break;
    case 'undo':delete state.passes[id];delete state.likes[id];state.group=state.group.filter(x=>x!==id);rerender();break;
    case 'add':addToGroup(id);break;
    case 'remove':state.group=state.group.filter(x=>x!==id);rerender();toast(t('tRemoved'));break;
    case 'preview-group':preview=id.split(',');go('home');focusHeading();toast(t('tPreview'));break;
    case 'propose':proposeGroup(id.split(','));break;
    case 'close-preview':preview=null;go('matches');focusHeading();break;
  }
});

tabsEl.addEventListener('keydown',e=>{
  const order=['you','matches','home'],i=order.indexOf(state.tab);let n=-1;
  if(e.key==='ArrowRight')n=(i+1)%order.length;else if(e.key==='ArrowLeft')n=(i+order.length-1)%order.length;else if(e.key==='Home')n=0;else if(e.key==='End')n=order.length-1;
  if(n<0)return;e.preventDefault();go(order[n]);focusTab();
});

applyHash();
render();
window.__juntos={get state(){return state;},get preview(){return preview;},get lang(){return LANG;},setLang:function(l){switchLang(l);},render:render,like:like,addToGroup:addToGroup,proposeGroup:proposeGroup,previewGroup:function(ids){preview=ids.slice();go('home');},go:go,lists:lists};
})();
</script>
</body>
</html>
